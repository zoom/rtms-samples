# Server Configuration
server.port=${SERVER_PORT:3000}

# Zoom Configuration
zoom.client.id=${ZOOM_CLIENT_ID:YOUR_ZOOM_CLIENT_ID_HERE}
zoom.client.secret=${ZOOM_CLIENT_SECRET:YOUR_ZOOM_CLIENT_SECRET_HERE}
zoom.secret.token=${ZOOM_SECRET_TOKEN:YOUR_ZOOM_SECRET_TOKEN_HERE}

# Application Configuration
app.mode=webhook
app.webhook.path=/webhook

# Logging
logging.level.com.zoom=DEBUG
logging.level.org.springframework.web.socket=WARN

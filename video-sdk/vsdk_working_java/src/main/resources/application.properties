# Server Configuration
server.port=${SERVER_PORT:3000}

# Zoom Configuration
zoom.client.id=${ZOOM_CLIENT_ID:xxxxxx}
zoom.client.secret=${ZOOM_CLIENT_SECRET:yyyyyy}
zoom.secret.token=${ZOOM_SECRET_TOKEN:zzzzz}

# Application Configuration
app.mode=webhook
app.webhook.path=/webhook

# Logging
logging.level.com.zoom=DEBUG
logging.level.org.springframework.web.socket=WARN

services:
  - type: web
    name: zoom-meeting-deepfake-detection
    runtime: docker
    repo: https://github.com/zoom/rtms-samples
    branch: tanchunsiong/deploy-deepfake-detection
    dockerContext: .
    dockerfilePath: ./zoom_apps/stream_audio_and_video_deepfake_detection_js/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5050"
      - key: WEBHOOK_PATH
        value: /webhook
      - key: ZOOM_SECRET_TOKEN
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: DEEPFAKE_MODE
        value: service
      - key: DEEPFAKE_SERVICE_URL
        sync: false
      - key: DEEPFAKE_API_KEY
        sync: false
      - key: AUDIO_DEEPFAKE_MODE
        value: service
      - key: AUDIO_DEEPFAKE_SERVICE_URL
        sync: false
      - key: MEDIA_SOCKET_CONNECTION_MODE
        value: split
      - key: MEDIA_TYPES_FLAG
        value: "3"
      - key: ENABLE_HLS_PREVIEW
        value: "true"
